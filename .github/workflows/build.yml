name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same ref when a new commit lands.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Run the schema-drift IT FIRST as a named step. If a Flyway
      # migration and a row record have diverged, this fails fast — and
      # the `::error::` annotation surfaces a clear "Schema drift
      # detected" banner in the PR's Checks tab. No drift reaches main.
      - name: Schema drift check (no DB↔code drift reaches main)
        run: |
          set -o pipefail
          if ! mvn -B -ntp -pl adapter-persistence-jdbc -am -DskipTests verify -Dit.test=SchemaDriftIT; then
            echo "::error title=Schema drift detected::Row records and Flyway-managed DB columns are out of sync. See SchemaDriftIT output above for the exact mismatch — fix the migration OR the row record before merging."
            exit 1
          fi

      - name: Full build, unit tests, integration tests
        # Testcontainers runs Postgres in Docker; ubuntu-latest ships
        # with Docker preinstalled, no extra setup needed.
        run: mvn -B -ntp verify

      - name: Upload surefire/failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
